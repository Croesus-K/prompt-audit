name: CI

# 自家测试门禁：lint + 全量测试（判定/提取/规则/回归/安全五套件）
# 判定包 injectarena-judge 以钉 commit 的 git 可选依赖安装（无需额外克隆）
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
